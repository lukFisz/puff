name: CI

on:
  release:
    types: [ published ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT
          SHORT_VERSION=$(echo $TAG | cut -d '.' -f 1,2)
          echo "SHORT_VERSION=$SHORT_VERSION" >> $GITHUB_OUTPUT

      - name: Build and push (linux/amd64, linux/arm64) RC tags
        if: contains(github.event.release.tag_name, '-RC')
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lukfisz/puff:${{ steps.get_version.outputs.VERSION }}

      - name: Build and push (linux/amd64, linux/arm64)
        if: ${{ !contains(github.event.release.tag_name, '-RC') }}
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lukfisz/puff:latest
            ghcr.io/lukfisz/puff:${{ steps.get_version.outputs.SHORT_VERSION }}
            ghcr.io/lukfisz/puff:${{ steps.get_version.outputs.VERSION }}